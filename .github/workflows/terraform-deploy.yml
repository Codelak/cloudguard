name: Terraform Deploy

# Two triggers, deliberately different in what they are allowed to do.
#
#   push to main  ->  plan only. Every commit gets the environment
#                     checked against real state, and nothing is changed.
#
#   manual run    ->  plan, and apply if you ask for it. Deploying stays
#                     a deliberate act rather than a side effect of
#                     pushing.
#
# That split is not ceremony. A workflow that applies on every push
# means a typo in a commit message is enough to change production
# infrastructure, and the person who wrote it has already moved on.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan? Leave unchecked to plan only."
        type: boolean
        default: false
  push:
    branches: [main]

# id-token: write is what makes OIDC work. It lets this job request a
# short-lived token from GitHub's identity provider, which AWS then
# exchanges for temporary credentials.
#
# Without it the job has no way to prove who it is, and the AWS step
# fails with a message about being unable to get an ID token. It is the
# single line most often missing from a broken OIDC setup.
permissions:
  id-token: write
  contents: read

# Remote state has a lock table, but the lock only protects against
# concurrent applies — it does not queue them. This does: two runs of
# this workflow can never overlap, and a run arriving while another is in
# progress waits its turn rather than failing.
concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # No AWS_ACCESS_KEY_ID, no AWS_SECRET_ACCESS_KEY, no repository
      # secret of any kind. The action asks GitHub for an OIDC token,
      # hands it to AWS STS, and receives credentials that expire within
      # the hour. That exchange is the whole of deliverable 6.
      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851725187277:role/cloudguard-github-actions-deploy
          aws-region: us-east-1

      # Printed deliberately, as evidence rather than for debugging. The
      # ARN below is an assumed-role session, not a user — which is the
      # visible difference between this and the static key it replaces.
      - name: Prove which identity is running
        run: |
          echo "Who am I?"
          aws sts get-caller-identity

          echo ""
          echo "Is there a static key anywhere in this environment?"
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS_ACCESS_KEY_ID is set - that should not happen"
            exit 1
          fi
          echo "No AWS_ACCESS_KEY_ID is set. Credentials came from OIDC only."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # This reads state from S3, which is why Phase 4 had to move the
      # state there first. A runner starts with nothing on disk.
      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Terraform plan
        run: terraform -chdir=terraform plan -no-color -lock-timeout=5m

      - name: Terraform apply
        if: ${{ inputs.apply }}
        run: terraform -chdir=terraform apply -auto-approve -lock-timeout=5m
